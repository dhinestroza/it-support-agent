[project]
name = "it-support-agent"
version = "0.1.0"
description = "Local RAG support agent for internal IT tickets (Assessment P3)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.2,<2",
    "chromadb>=0.5",
    "fastapi>=0.115",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=3.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
